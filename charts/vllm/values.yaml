# -- String to partially override fullname template (will maintain the release name).
nameOverride: ""
# -- String to fully override fullname template.
fullnameOverride: ""

# -- Number of vLLM pod replicas.
replicaCount: 1

deploymentStrategy:
  # -- Deployment strategy type (for example RollingUpdate or Recreate).
  type: RollingUpdate

image:
  # -- Container image registry for the vLLM runtime image.
  registry: registry.redhat.io
  # -- Container image repository for the vLLM runtime image.
  repository: rhaii/vllm-cuda-rhel9
  # -- Image pull policy for the vLLM runtime image.
  pullPolicy: IfNotPresent
  # -- Image tag for the vLLM runtime image. Defaults to the chart appVersion when empty.
  tag: "3.5.1"

# -- Secrets for pulling images from private registries. See https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

configuration:
  # -- Additional environment variables for the vLLM container (merged into the chart ConfigMap). HF_HOME and HF_HUB_OFFLINE are managed by the chart.
  env: {}
  # -- Extra arguments passed to `vllm serve`. See https://docs.vllm.ai/en/latest/serving/engine_args.html
  extraArgs:
    - --disable-access-log-for-endpoints=/health,/metrics,/ping
  shm:
    # -- Size of the in-memory emptyDir mounted at /dev/shm.
    size: 2Gi
  model:
    # -- Hugging Face model ID used when model.type is pvc or emptyDir, 
    # and as --served-model-name when set (otherwise the Helm release name is used).
    name: ibm-granite/granite-3.3-2b-instruct
    # -- Model storage type. Must be one of image, pvc, or emptyDir.
    type: image
    # -- Mount path for model files (HF_HOME) and the local path passed to vllm serve when type is image.
    mountPath: /mnt/models
    hfModelDownload:
      # -- Download the model from Hugging Face at startup when type is pvc or emptyDir. Sets HF_HUB_OFFLINE=0 and mounts model storage read/write.
      enabled: true
      # -- Hugging Face token (HF_TOKEN) when hfModelDownload.enabled is true. Required for gated models.
      huggingfaceToken: null
    pvc:
      # -- PVC storage size when model.type is pvc, or emptyDir sizeLimit when model.type is emptyDir.
      size: 20Gi
      # -- Access modes for the model PVC.
      accessModes:
        - ReadWriteOnce
    image:
      # -- OCI model packaging when model.type is image. Must be one of artifact or modelCar.
      type: modelCar
      # -- OCI reference for model.image.type artifact (image volume) or modelCar sidecar/init image.
      reference: "quay.io/redhat-ai-services/modelcar-catalog:granite-3.3-2b-instruct"
      # -- Pull policy for the model OCI image when using modelCar or artifact storage.
      pullPolicy: IfNotPresent
    # -- The emptyDir configuration when type is emptyDir.
    emptyDir: {}
  cache:
    # -- Cache volume type for /home/vllm/.cache. Must be one of pvc or emptyDir.
    type: emptyDir
    # -- The emptyDir configuration when type is emptyDir.
    emptyDir: {}
    pvc:
      # -- Size of the cache volume when type is pvc (storage request).
      size: 20Gi
      # -- Access modes for the cache PVC.
      accessModes:
        - ReadWriteOnce

serviceAccount:
  # -- Create a dedicated ServiceAccount for the vLLM pod.
  create: true
  # -- Automount the ServiceAccount API token into the pod.
  automount: true
  # -- Annotations added to the ServiceAccount.
  annotations: {}
  # -- ServiceAccount name. If empty and create is true, the chart fullname is used.
  name: ""

# -- Annotations added to the pod template.
podAnnotations:
  prometheus.io/path: /metrics
  prometheus.io/port: "8000"

# -- Labels added to the pod template.
podLabels: {}

# -- Security context for the vLLM pod.
podSecurityContext:
  runAsNonRoot: true
  # fsGroup: 2000

# -- Security context for the vLLM container.
securityContext:
  capabilities:
    drop:
    - ALL
  # KServe rhaii/vllm-cuda-rhel9 pods use readOnlyRootFilesystem: false so plugins can load
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

service:
  # -- Kubernetes Service type for the vLLM API.
  type: ClusterIP
  # -- Port exposed by the Service and used by vllm serve.
  port: 8000

route:
  # -- Create an OpenShift Route for external access to the vLLM API.
  enabled: true
  # -- Annotations added to the Route.
  annotations: {}
  tls:
    # -- Enable TLS termination on the Route.
    enabled: true
    # -- OpenShift Route insecure edge termination policy when TLS is enabled.
    insecureEdgeTerminationPolicy: Redirect
  # -- Optional Route subdomain (cluster-dependent).
  subdomain: ""

# -- CPU, memory, and accelerator resources for the vLLM container.
resources:
  limits:
    cpu: 4
    memory: 16Gi
    nvidia.com/gpu: 1
  requests:
    cpu: 2
    memory: 8Gi
    nvidia.com/gpu: 1

# -- Liveness probe for the vLLM HTTP endpoint.
livenessProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 2
  periodSeconds: 60
  timeoutSeconds: 3
# -- Readiness probe for the vLLM HTTP endpoint.
readinessProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 3
  periodSeconds: 30
  timeoutSeconds: 3
# -- Startup probe for the vLLM HTTP endpoint.
startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 180
  periodSeconds: 10
  timeoutSeconds: 3

# -- Node selector for scheduling the vLLM pod.
nodeSelector: {}

# -- Tolerations for scheduling the vLLM pod onto GPU (or other tainted) nodes.
tolerations:
  - key: nvidia.com/gpu
    effect: NoSchedule
    operator: Exists

# -- Pod affinity rules for the vLLM workload.
affinity: {}
