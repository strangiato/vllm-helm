{{- if and (ne .Values.configuration.model.type "image") .Values.configuration.model.hfModelDownload.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vllm.fullname" . }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
type: Opaque
stringData:
  HF_TOKEN: {{ .Values.configuration.model.hfModelDownload.huggingfaceToken | quote }}
{{- end }}
